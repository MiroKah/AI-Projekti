# =============================================================================
# StudyAI Backend — projektimetatiedot ja työkaluasetukset
# =============================================================================
[project]
name = "studyai-backend"
version = "0.1.0"
description = "StudyAI RAG-backend (FastAPI + pgvector + OpenAI)"
requires-python = ">=3.12"
readme = "../README.md"

# --- Työkaluasetukset ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI-riippuvuudet (Depends/File/...) ovat oletusarvoja eivätkä suorita
# todellista työtä oletuksen arvolla → sallitaan argumenttioletuksissa.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"